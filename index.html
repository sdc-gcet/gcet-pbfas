<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCET &mdash; Performance Based Faculty Appraisal System (PBAS) &middot; Software Development Cell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#eef0f4;
    --surface:#ffffff;
    --surface-2:#f6f7fa;
    --surface-3:#eceff4;
    --ink:#12161d;
    --ink-2:#4a5464;
    --ink-3:#7a8494;
    --line:#dee1e8;
    --line-2:#c6cbd6;
    --accent:#17325c;
    --accent-2:#3567b0;
    --accent-ink:#ffffff;
    --accent-soft:#e8eef8;
    --brass:#8a6115;
    --brass-soft:#f8f1e2;
    --danger:#a32b28;
    --danger-soft:#fbecec;
    --ok:#1c6a45;
    --ok-soft:#e5f2ea;
    --warn:#8a5a10;
    --warn-soft:#fbf1de;
    --focus:#3567b0;
    --r:8px;
    --r-lg:12px;
    --shadow:0 1px 2px rgba(18,22,29,.04), 0 10px 30px -22px rgba(18,22,29,.4);
    --topbar:78px;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0d1116; --surface:#141920; --surface-2:#1a202a; --surface-3:#222935;
      --ink:#e8ecf3; --ink-2:#a6b1c0; --ink-3:#7a8496;
      --line:#262e3a; --line-2:#374252;
      --accent:#8ab0ee; --accent-2:#a6c4f4; --accent-ink:#0d1116; --accent-soft:#17202e;
      --brass:#d8a95f; --brass-soft:#272114;
      --danger:#e98d88; --danger-soft:#2d1b1b;
      --ok:#6cc79a; --ok-soft:#14291f;
      --warn:#dfae63; --warn-soft:#282214;
      --focus:#7fa8ea;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -22px rgba(0,0,0,.9);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1116; --surface:#141920; --surface-2:#1a202a; --surface-3:#222935;
    --ink:#e8ecf3; --ink-2:#a6b1c0; --ink-3:#7a8496;
    --line:#262e3a; --line-2:#374252;
    --accent:#8ab0ee; --accent-2:#a6c4f4; --accent-ink:#0d1116; --accent-soft:#17202e;
    --brass:#d8a95f; --brass-soft:#272114;
    --danger:#e98d88; --danger-soft:#2d1b1b;
    --ok:#6cc79a; --ok-soft:#14291f;
    --warn:#dfae63; --warn-soft:#282214;
    --focus:#7fa8ea;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -22px rgba(0,0,0,.9);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  [hidden]{display:none !important}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

  /* ============ top bar ============ */
  .topbar{
    position:sticky;top:0;z-index:40;height:var(--topbar);
    display:flex;align-items:center;gap:18px;padding:0 clamp(16px,2.2vw,28px);
    background:var(--surface);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .logo{flex:none;display:block;border-radius:50%;object-fit:contain}
  :root[data-theme="dark"] .logo,
  :root:not([data-theme="light"]) .logo{background:#fff;padding:2px}
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .logo{background:none;padding:0}}
  .brand-txt{min-width:0}
  .brand-txt h1{
    font-family:"Newsreader",Georgia,serif;font-size:18px;font-weight:600;margin:0;
    line-height:1.2;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .brand-txt p{margin:2px 0 0;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--brass)}

  /* ============ college banner ribbon ============ */
  .college-banner{
    height:54px;width:auto;max-width:320px;object-fit:contain;
    flex:none;display:block;transition:height .2s ease;
  }
  .brand-divider{height:42px;width:1.5px;background:var(--line-2);flex:none;margin:0 6px;opacity:.75}
  :root[data-theme="dark"] .college-banner,
  :root:not([data-theme="light"]) .college-banner{background:#ffffff;padding:4px 8px;border-radius:6px}
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]) .college-banner{background:none;padding:0}
  }
  @media (max-width:1100px){
    .college-banner{height:46px;max-width:260px}
    .brand-divider{height:36px}
  }
  @media (max-width:850px){
    .college-banner{height:40px;max-width:210px}
    .brand-divider{height:30px;margin:0 3px}
  }
  @media (max-width:600px){
    .college-banner{height:34px;max-width:170px}
  }

  /* ============ application footer ============ */
  #root{min-height:100vh;display:flex;flex-direction:column}
  .app-footer{
    margin-top:auto;background:var(--surface);border-top:1px solid var(--line);
    padding:16px clamp(16px,2.2vw,28px);font-size:12.5px;color:var(--ink-3);
  }
  .app-footer-inner{
    max-width:1440px;margin:0 auto;display:flex;align-items:center;
    justify-content:space-between;flex-wrap:wrap;gap:10px 20px;
  }
  .footer-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2)}
  .footer-sep{color:var(--line-2)}
  .footer-credit{
    font-weight:600;color:var(--ink);font-size:12px;letter-spacing:.02em;
    background:var(--surface-2);padding:5px 12px;border-radius:var(--r);
    border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;
  }
  .print-banner{height:60px;width:auto;max-width:360px;object-fit:contain;flex:none}
  .print-divider{height:48px;width:1.5px;background:#888;margin:0 10px;flex:none}
  .print-footer{
    display:none;margin-top:24px;padding-top:12px;border-top:1px solid #ccc;
    font-size:10.5px;color:#555;text-align:center;
  }
  @media print{.print-footer{display:block}}

  /* letterhead, printed copies only */
  .printhead{display:none}
  .topbar .sp{margin-left:auto}
  .cyclechip{
    font-size:11.5px;color:var(--ink-2);border-left:2px solid var(--brass);padding-left:11px;line-height:1.3;
  }
  .cyclechip b{display:block;font-size:13px;color:var(--ink);font-weight:600}
  @media (max-width:900px){.cyclechip,.brand-txt p{display:none}}

  .btn{
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r);
    padding:7px 14px;font-size:13px;font-weight:500;white-space:nowrap;
    transition:border-color .15s,background .15s,opacity .15s,color .15s;
  }
  .btn:hover{border-color:var(--accent);background:var(--surface-2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn-primary:hover{opacity:.88;background:var(--accent)}
  .btn-quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
  .btn-quiet:hover{border-color:var(--line-2);background:var(--surface-2)}
  .btn-sm{padding:5px 11px;font-size:12px}
  .btn-lg{padding:11px 24px;font-size:14.5px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .docpill{
    display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
    border:1px solid var(--line-2);border-radius:50px;padding:5px 13px;color:var(--ink-2);
  }
  .docpill b{color:var(--ink)}
  .docpill.done{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft);color:var(--ok)}
  .docpill.done b{color:var(--ok)}

  /* ============ shell ============ */
  .shell{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr);align-items:start}
  @media (max-width:1000px){.shell{grid-template-columns:minmax(0,1fr)}}

  .side{
    position:sticky;top:var(--topbar);height:calc(100vh - var(--topbar));overflow:auto;
    background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 28px;
  }
  .side h3{
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 10px;padding:0 10px;
  }
  .navlist{display:flex;flex-direction:column;gap:2px}
  .navitem{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    border:0;background:transparent;color:var(--ink-2);border-radius:var(--r);
    padding:9px 11px;font-size:13.5px;font-weight:500;transition:background .15s,color .15s;
  }
  .navitem:hover{background:var(--surface-2);color:var(--ink)}
  .navitem.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .navitem .k{
    flex:none;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;
    font-family:"Newsreader",Georgia,serif;font-size:11.5px;font-weight:600;
    background:var(--surface-3);color:var(--ink-3);
  }
  .navitem.on .k{background:var(--accent);color:var(--accent-ink)}
  .navitem .st{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
  .navitem .st.ok{background:var(--ok)}
  .navitem .st.part{background:var(--warn)}
  .sideprog{margin:20px 10px 0;padding-top:18px;border-top:1px solid var(--line)}
  .sideprog .lbl{font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;margin-bottom:7px}
  .bar{height:5px;border-radius:50px;background:var(--surface-3);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .savestate{margin:16px 10px 0;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:7px}
  .savestate .dot{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
  .savestate .dot.on{background:var(--ok)}

  /* mobile nav strip */
  .navstrip{display:none}
  @media (max-width:1000px){
    .side{display:none}
    .navstrip{
      display:flex;gap:6px;overflow-x:auto;padding:10px clamp(16px,3vw,24px);
      background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:var(--topbar);z-index:30;
    }
    .navstrip button{
      flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
      border-radius:50px;padding:6px 14px;font-size:12.5px;font-weight:500;
    }
    .navstrip button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  }

  .main{min-width:0;padding:clamp(22px,2.4vw,34px) clamp(18px,3vw,44px) 90px}
  .page{max-width:1360px;margin:0 auto}

  /* ============ headings ============ */
  /* --- page heading: eyebrow pill, oversized serif, accent rule --- */
  .phead{margin:0 0 28px;padding-bottom:20px;border-bottom:2px solid var(--line)}
  .phead .eye{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;
    color:var(--brass);background:var(--brass-soft);border:1px solid color-mix(in srgb,var(--brass) 28%,transparent);
    border-radius:50px;padding:4px 12px;margin:0 0 14px;
  }
  .phead h2{
    position:relative;padding-left:20px;
    font-family:"Newsreader",Georgia,serif;font-size:clamp(28px,3.4vw,40px);font-weight:600;
    margin:0;letter-spacing:-.022em;line-height:1.08;text-wrap:balance;
  }
  .phead h2::before{
    content:"";position:absolute;left:0;top:.14em;bottom:.14em;width:5px;
    border-radius:3px;background:var(--accent);
  }
  .phead p{margin:12px 0 0 20px;font-size:14.5px;color:var(--ink-2);max-width:66ch;line-height:1.55}

  /* --- block heading: brass rule, larger --- */
  .block{margin-bottom:30px}
  .block > h3{
    position:relative;padding-left:15px;color:var(--ink);
    font-family:"Newsreader",Georgia,serif;font-size:21px;font-weight:600;margin:0 0 5px;letter-spacing:-.015em;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .block > h3::before{
    content:"";position:absolute;left:0;top:.22em;bottom:.22em;width:3px;
    border-radius:2px;background:var(--brass);
  }
  .block > .sub{margin:0 0 16px;padding-left:15px;font-size:13px;color:var(--ink-3)}

  /* --- heading inside a card --- */
  .ch{
    font-family:"Newsreader",Georgia,serif;font-size:20px;font-weight:600;color:var(--ink);
    margin:0 0 4px;letter-spacing:-.015em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .card > .sub{margin:0 0 18px;font-size:13px;color:var(--ink-3)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px 24px}
  .card + .card{margin-top:14px}
  @media (max-width:620px){.card{padding:18px 16px}}

  /* ============ fields ============ */
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:17px 20px}
  .fgrid.tight{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
  .wide{grid-column:1/-1}
  @supports not (grid-template-columns:repeat(auto-fit,minmax(215px,1fr))){.fgrid{display:block}}
  .f{display:flex;flex-direction:column;gap:6px;min-width:0}
  .f > label{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px;line-height:1.35;letter-spacing:.005em}
  .req{color:var(--danger);font-weight:700}
  .tag{
    flex:none;font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;color:var(--ink-3);
  }
  .tag.auto{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 40%,transparent)}
  input,select,textarea{
    font:inherit;font-size:14px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line-2);border-radius:var(--r);padding:9px 11px;width:100%;min-width:0;
    transition:border-color .15s,box-shadow .15s;
  }
  select{cursor:pointer}
  textarea{resize:vertical;min-height:80px;line-height:1.5}
  input:hover,select:hover,textarea:hover{border-color:var(--ink-3)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 16%,transparent)}
  input.bad,select.bad{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 14%,transparent)}
  input[readonly]{background:var(--brass-soft);border-color:color-mix(in srgb,var(--brass) 32%,var(--line-2));font-weight:600;cursor:default}
  .help{font-size:11.5px;color:var(--ink-3);line-height:1.4}
  .errtx{font-size:11.5px;color:var(--danger);font-weight:500}
  .suffix{position:relative}
  .suffix input{padding-right:56px}
  .suffix span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--ink-3);pointer-events:none}

  /* ============ teaching load groups ============ */
  .loadgroup{margin-bottom:18px}
  .loadgroup:last-child{margin-bottom:0}
  .loadgroup.ruled{padding-top:16px;border-top:1px solid var(--line)}
  .loadgroup h4{
    font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-2);margin:0 0 11px;
  }

  /* ============ counts ============ */
  .countgroup{margin-bottom:20px}
  .countgroup:last-of-type{margin-bottom:0}
  .countgroup.ruled{padding-top:18px;border-top:1px solid var(--line)}
  .countgroup > h4{
    font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-2);margin:0 0 3px;
  }
  .countgroup > p{margin:0 0 13px;font-size:12.5px;color:var(--ink-3);line-height:1.45}
  .countgroup .counts{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .countgroup .cbox label{min-height:0}

  .counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .cbox{display:flex;flex-direction:column;gap:6px}
  .cbox label{font-size:12px;font-weight:500;color:var(--ink-2);line-height:1.35;min-height:2.7em;display:flex;align-items:flex-end}
  .cbox input{text-align:center;font-weight:600;font-size:16px;padding:10px 8px}
  .stats{display:flex;flex-wrap:wrap;margin-top:20px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
  .stat{flex:1 1 140px;padding:12px 16px;border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
  .stat .l{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
  .stat .v{font-family:"Newsreader",Georgia,serif;font-size:26px;font-weight:600;color:var(--accent);line-height:1.15}

  .note{
    margin:0 0 18px;padding:11px 15px;border-left:3px solid var(--brass);background:var(--brass-soft);
    font-size:13px;color:var(--ink-2);border-radius:0 var(--r) var(--r) 0;
  }

  /* ============ entry cards ============ */
  .entries{display:flex;flex-direction:column;gap:12px}
  .entry{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
  .entry-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;
    background:var(--surface-2);border-bottom:1px solid var(--line);
  }
  .entry-head .n{
    font-family:"Newsreader",Georgia,serif;font-size:15px;font-weight:600;color:var(--ink);
    display:inline-flex;align-items:center;gap:9px;letter-spacing:-.01em;
  }
  .entry-head .n i{
    font-style:normal;width:23px;height:23px;border-radius:6px;background:var(--accent);
    display:grid;place-items:center;font-size:11.5px;color:var(--accent-ink);font-weight:600;
  }
  .entry-body{padding:18px}
  .chip{
    font-size:10.5px;font-weight:600;letter-spacing:.03em;border-radius:50px;padding:3px 10px;
    border:1px solid var(--line-2);color:var(--ink-3);background:var(--surface);white-space:nowrap;
  }
  .chip.ok{border-color:color-mix(in srgb,var(--ok) 42%,transparent);background:var(--ok-soft);color:var(--ok)}
  .chip.bad{border-color:color-mix(in srgb,var(--danger) 42%,transparent);background:var(--danger-soft);color:var(--danger)}
  .chip.warn{border-color:color-mix(in srgb,var(--warn) 42%,transparent);background:var(--warn-soft);color:var(--warn)}
  .chip.brass{border-color:color-mix(in srgb,var(--brass) 42%,transparent);background:var(--brass-soft);color:var(--brass)}
  .chip-btn{cursor:pointer}
  .chip-btn:hover{border-color:var(--accent);color:var(--accent)}
  .entry.flag{border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
  .rowx{
    margin-left:auto;border:0;background:transparent;color:var(--ink-3);
    font-size:13px;padding:4px 9px;border-radius:6px;
  }
  .rowx:hover{background:var(--danger-soft);color:var(--danger)}
  .none{
    padding:26px;text-align:center;font-size:13.5px;color:var(--ink-3);
    border:1px dashed var(--line-2);border-radius:var(--r-lg);background:var(--surface-2);
  }

  /* ============ documents ============ */
  .dz{
    position:relative;overflow:hidden;
    border:2px dashed var(--line-2);border-radius:var(--r-lg);background:var(--surface-2);
    padding:clamp(26px,4vw,44px) 24px;text-align:center;cursor:pointer;display:block;
    transition:border-color .18s,background .18s;
  }
  .dz:hover,.dz.over{border-color:var(--accent);background:var(--accent-soft)}
  .dz .big{font-family:"Newsreader",Georgia,serif;font-size:19px;font-weight:600;color:var(--ink);margin:0 0 6px}
  .dz .sm{font-size:13px;color:var(--ink-3);margin:0}
  .dz input{position:absolute;width:1px;height:1px;opacity:0;padding:0;border:0}
  .dzicon{
    width:44px;height:44px;margin:0 auto 14px;border-radius:12px;background:var(--surface);
    border:1px solid var(--line-2);display:grid;place-items:center;color:var(--accent);
  }

  .slotlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .slot{
    display:grid;grid-template-columns:1fr minmax(200px,300px);gap:12px;align-items:center;
    border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;background:var(--surface);
  }

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<!-- =========================================================
     Google Apps Script backend
     Submission, certificate upload and drafts. Plain JS, no JSX,
     so Babel never touches it.
     ========================================================= -->
<script>
/* ---------------------------------------------------------
   1. CONFIGURATION — the only line the SDC has to edit.

   Paste the Apps Script /exec URL from backend/GOOGLE-SETUP.md.
   While it still reads PASTE_..., the form runs exactly as it did
   before: local draft, print and export, and no network.
   --------------------------------------------------------- */
window.PBAS_CONFIG = {
  endpoint : "https://script.google.com/macros/s/AKfycbwZ4ttWJWSDsxIAwvR-0RLWU3U2sgsAmVAvQL4Lcl3VPlZ6Hx6YjC1tE12v-ERs_mcO3A/exec",
  cycle    : "2025-26",
  maxMB    : 5,
  allowedTypes : ["application/pdf", "image/jpeg", "image/png", "image/webp"]
};

(function(){
  "use strict";

  var CFG = window.PBAS_CONFIG;

  function unset(v){ return !v || String(v).indexOf("PASTE_") === 0; }
  var configured = !unset(CFG.endpoint);

  function err(message, detail){
    var e = new Error(message);
    e.detail = detail;
    return e;
  }

  /* Posted as text/plain on purpose. Apps Script cannot answer a CORS
     preflight, and text/plain keeps the request "simple" so the browser
     never sends one. */
  function post(body){
    if(!configured) return Promise.reject(err("The backend is not configured yet — the Apps Script URL is still a placeholder."));
    return fetch(CFG.endpoint, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body),
      redirect: "follow"
    }).then(function(res){
      return res.text().then(function(text){
        var data;
        try { data = JSON.parse(text); }
        catch(e){
          /* Apps Script serves an HTML error page when the deployment is
             wrong — far more useful to say so than to show raw markup. */
          if(/<html/i.test(text))
            throw err("The endpoint returned a web page instead of data. The deployment is probably set to “Only myself” rather than “Anyone”, or the URL is the /dev one instead of /exec.");
          throw err("The endpoint returned something unreadable: " + text.slice(0, 120));
        }
        if(!data.ok) throw err(data.error || "The endpoint refused the request.");
        return data;
      });
    }).catch(function(e){
      if(e instanceof TypeError)
        throw err("Could not reach the endpoint. Check the internet connection, and that the Apps Script deployment is set to “Anyone”.");
      throw e;
    });
  }

  function readBase64(file){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){
        var s = String(r.result);
        resolve(s.slice(s.indexOf(",") + 1));   /* strip the data: prefix */
      };
      r.onerror = function(){ reject(err("Could not read " + file.name + ".")); };
      r.readAsDataURL(file);
    });
  }

  /* ---------- submit ----------
     payload  the JSON the form already builds for Export
     files    [{name, slot, file}] — one per attached certificate
     onStep   (done, total, label) => void
  */
  function submit(payload, files, onStep){
    files = files || [];
    var step = onStep || function(){};
    var p = payload.profile || {};
    if(!p.empid) return Promise.reject(err("Enter the employee ID before submitting — it is what the submission is filed under."));

    var total = files.length + 2;
    var done = 0;
    var tick = function(label){ done++; step(done, total, label); };
    var uploaded = [], failed = [];

    step(0, total, "Preparing");

    /* One at a time: each certificate is base64, and a burst of them is
       both a large memory spike and a good way to hit Apps Script quotas. */
    var chain = Promise.resolve();
    files.forEach(function(f, i){
      chain = chain.then(function(){
        var mb = f.file.size / 1048576;
        if(mb > CFG.maxMB){
          failed.push({ name:f.name, reason:"Larger than " + CFG.maxMB + " MB" });
          tick(f.name + " — too large");
          return;
        }
        if(CFG.allowedTypes.indexOf(f.file.type) === -1){
          failed.push({ name:f.name, reason:"Type not accepted: " + (f.file.type || "unknown") });
          tick(f.name + " — wrong type");
          return;
        }
        return readBase64(f.file).then(function(b64){
          return post({
            action:"upload", empid:p.empid, name:p.name, dept:p.dept,
            slot:f.slot || "", slotTitle:f.slotTitle || "",
            fileName:f.name, mimeType:f.file.type, data:b64
          });
        }).then(function(res){
          uploaded.push({ name:res.name, url:res.viewUrl, size:res.size, slot:f.slot || null });
          tick(f.name);
        }).catch(function(e){
          failed.push({ name:f.name, reason:e.message });
          tick(f.name + " — failed");
        });
      });
    });

    return chain.then(function(){
      tick("Certificates done");
      return post({ action:"submit", payload:payload, evidence:uploaded, evidenceFailed:failed });
    }).then(function(res){
      tick("Submission recorded");
      return {
        reference : res.reference,
        folderUrl : res.folderUrl,
        jsonUrl   : res.jsonUrl,
        uploaded  : uploaded.length,
        failed    : failed
      };
    });
  }

  /* ---------- drafts ----------
     Keyed by employee ID, because the form has no sign-in. Anyone who knows
     an employee ID can load that draft — the same exposure as being able to
     submit under it. */
  function saveDraft(empid, data){
    if(!empid) return Promise.reject(err("No employee ID yet."));
    return post({ action:"draftSave", empid:empid, data:data }).then(function(r){ return r.savedAt; });
  }

  function loadDraft(empid){
    if(!empid) return Promise.resolve(null);
    return post({ action:"draftLoad", empid:empid }).then(function(r){ return r.draft || null; });
  }

  function deleteDraft(empid){
    if(!empid) return Promise.resolve(null);
    return post({ action:"draftDrop", empid:empid }).catch(function(){ return null; });
  }

  function ping(){ return post({ action:"ping" }); }

  window.PBAS = {
    configured : configured,
    cycle      : CFG.cycle,
    ping       : ping,
    submit     : submit,
    saveDraft  : saveDraft,
    loadDraft  : loadDraft,
    deleteDraft: deleteDraft
  };
})();
</script>

/* =========================================================

const DEPARTMENTS = [

  "CSE – Data Science","CSE – Cyber Security","Information Technology (IT)",

  "Mechanical Engineering (ME)","Civil Engineering (CE)","Master of Business Administration (MBA)",
  "Humanities & Sciences (H&S)","Physical Education","Other"
];

const n = v => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };
const cnt = v => { let x = parseInt(v, 10); if(isNaN(x) || x < 0) x = 0; return Math.min(x, 99); };
const round2 = x => String(Math.round(x * 100) / 100);
const fmtSize = b => b < 1024 ? b + " B" : b < 1048576 ? (b/1024).toFixed(0) + " KB" : (b/1048576).toFixed(1) + " MB";
const fmtDate = iso => { const p = String(iso || "").split("-"); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : (iso || ""); };
const uid = () => Math.random().toString(36).slice(2, 10);

function serviceText(doj){
  if(!doj) return "";
  const s = new Date(doj + "T00:00:00"), now = new Date();
  if(isNaN(s.getTime()) || s > now) return "—";
  let m = (now.getFullYear() - s.getFullYear()) * 12 + (now.getMonth() - s.getMonth());
  if(now.getDate() < s.getDate()) m--;
  if(m < 0) m = 0;
  const y = Math.floor(m / 12), r = m % 12;
  return `${y} ${y === 1 ? "year" : "years"} ${r} ${r === 1 ? "month" : "months"}  (${round2(y + r/12)} years)`;
}

/* =========================================================
   Scoring — the printed form, item by item.
   Objective bands are computed; the subjective components
   are the marks awarded by the observer, HoD, Group Head
   or Head of the Institution.
   ========================================================= */
const mk = (v, max) => Math.max(0, Math.min(max, Math.round(n(v))));

function theoryCourses(load){
  const out = [];
  ["s1","s2"].forEach(s => [1,2,3].forEach(i => {
    const title = String(load[`${s}_sub${i}`] || "").trim();
    if(title) out.push({
      sem:s === "s1" ? "Semester I" : "Semester II",
      title,
      hours:n(load[`${s}_sub${i}_hrs`]),
      pass:n(load[`${s}_sub${i}_pass`])
    });
  }));
  return out;
}

function computeScores(state, slotsBySpec){
  const c = state.counts, t = state.teaching, m = state.mentoring, r = state.ratings;
  const rows = id => (slotsBySpec[id] || []).map(sl => state.data[sl.key] || {});

  /* ---- 1. Classroom teaching (150) ---- */
  const courses = theoryCourses(state.load);
  const metHours = courses.filter(x => x.hours >= MIN_HOURS).length;
  const i1a = courses.length ? Math.round(MAX.i1a * metHours / courses.length) : 0;
  const graded = courses.filter(x => x.pass > 0);
  const avgPass = graded.length ? graded.reduce((a,x) => a + x.pass, 0) / graded.length : 0;
  const i1e = resultMark(avgPass);
  const i1b = mk(t.b_marks, MAX.i1b), i1c = mk(t.c_marks, MAX.i1c);
  const i1d = mk(t.d_marks, MAX.i1d), i1f = mk(t.f_marks, MAX.i1f);
  const i1 = Math.min(MAX.i1, i1a + i1b + i1c + i1d + i1e + i1f);

  /* ---- 2. Mentoring (50) ---- */
  const facultyTrack = mentorMode(state) === "faculty";
  const i2 = facultyTrack
    ? Math.min(MAX.i2, mk(m.fa_marks, MAX.i2fa) + mk(m.fb_marks, MAX.i2fb))
    : Math.min(MAX.i2, mk(m.a_marks, MAX.i2a) + mk(m.b_marks, MAX.i2b) + mk(m.c_marks, MAX.i2c)
                     + mk(m.d_marks, MAX.i2d) + mk(m.e_marks, MAX.i2e));

  /* ---- 3. Research publications (100) ---- */
  const nSci   = cnt(c.j_sci);
  const nSwos  = cnt(c.j_scopus) + cnt(c.j_wos) + cnt(c.j_ieee);
  const nTexts = rows("book").filter(b => b.publisher_tier === PUBTIER[0]).length;
  const i3 = Math.min(MAX.i3, nSci * 100 + nSwos * 50 + nTexts * 100);

  /* ---- 4. MOOCs through SWAYAM / NPTEL (50) ---- */
  const nMooc = cnt(c.d_nptel);
  const i4 = nMooc >= 1 ? MAX.i4 : 0;

  /* ---- 5. Resource person / chairing international conferences (50) ---- */
  const nRes = cnt(c.r_resource);
  const i5 = nRes >= 1 ? MAX.i5 : 0;

  /* ---- 6. Attending FDPs (25) ---- */
  const nFdp = cnt(c.d_fdp);
  const i6 = nFdp >= 1 ? MAX.i6 : 0;

  /* ---- 7. Sponsored research projects (50) ---- */
  const nSpon = cnt(c.sp_projects);
  const i7auto = sponsoredMark(nSpon);
  const i7 = String(state.awarded.i7).trim() === "" ? Math.min(MAX.i7, i7auto) : mk(state.awarded.i7, MAX.i7);

  /* ---- 8. Consultancy activities (50) ---- */
  const consultTotal = rows("consultancy").reduce((a, x) => a + n(x.amount), 0);
  const i8 = consultMark(consultTotal);

  /* ---- 9. Students supervision (200) ---- */
  const supRows = rows("supervision");
  const i9raw = supRows.reduce((a, e) => {
    const s = SUPERVISION.find(x => x.l === e.category);
    return a + (s ? (e.prize === "Yes" ? s.prize : s.base) : 0);
  }, 0);
  const i9 = Math.min(MAX.i9, i9raw);

  /* ---- 10. Educational administration assignments (50) ---- */
  const i10raw = ADMIN_ROLES.reduce((a, x) => a + (state.admin[x.k] ? x.m : 0), 0);
  const i10 = Math.min(MAX.i10, i10raw);

  /* ---- 11. Organization of educational / co-curricular activities (25) ---- */
  const i11raw = ORG_ACTIVITIES.reduce((a, x) => a + cnt(state.events[x.k]) * x.m, 0);
  const i11 = Math.min(MAX.i11, i11raw);

  /* ---- 12. Students ratings on TLP (35) ---- */
  const i12a = feedbackMark(n(r.feedback)), i12b = cesMark(n(r.ces));
  const i12 = i12a + i12b;

  /* ---- 13. Research project on internal seed funding (40) ---- */
  const seedAmt = n(state.seed.amount);
  const i13 = seedAmt >= 200000 ? MAX.i13 : 0;

  /* ---- 14. Group Head rating (50) ---- */
  const i14raw = GH_RATING.reduce((a, x) => a + mk(r["gh_" + x.k], x.m), 0);
  const i14 = Math.min(MAX.i14, i14raw);

  /* ---- 15. HoD rating (50) ---- */
  const i15raw = HOD_RATING.reduce((a, x) => a + mk(r["hod_" + x.k], x.m), 0);
  const i15 = Math.min(MAX.i15, i15raw);

  /* ---- 16. Rating by the Head of the Institution (25) ---- */
  const i16 = mk(r.hoi, MAX.i16);

  const items = [
    {n:"1",  page:"teaching",       label:"Classroom teaching",                          got:i1,  max:MAX.i1},
    {n:"2",  page:"mentoring",      label:facultyTrack ? "Faculty mentoring" : "Student mentoring", got:i2, max:MAX.i2},
    {n:"3",  page:"research",       label:"Research publications",                       got:i3,  max:MAX.i3},
    {n:"4",  page:"development",    label:"MOOCs through SWAYAM / NPTEL",                got:i4,  max:MAX.i4},
    {n:"5",  page:"development",    label:"Resource person in FDP / chairing conferences",got:i5, max:MAX.i5},
    {n:"6",  page:"development",    label:"Attending FDPs",                              got:i6,  max:MAX.i6},
    {n:"7",  page:"projects",       label:"Sponsored research projects",                 got:i7,  max:MAX.i7},
    {n:"8",  page:"projects",       label:"Consultancy activities",                      got:i8,  max:MAX.i8},
    {n:"9",  page:"supervision",    label:"Students supervision for research & allied activities", got:i9, max:MAX.i9},
    {n:"10", page:"administration", label:"Educational administration assignments",      got:i10, max:MAX.i10},
    {n:"11", page:"supervision",    label:"Organization of educational activities",      got:i11, max:MAX.i11},
    {n:"12", page:"ratings",        label:"Students ratings on TLP",                     got:i12, max:MAX.i12},
    {n:"13", page:"projects",       label:"Project on internal seed funding",            got:i13, max:MAX.i13},
    {n:"14", page:"ratings",        label:"Group Head rating",                           got:i14, max:MAX.i14},
    {n:"15", page:"ratings",        label:"HoD rating",                                  got:i15, max:MAX.i15},
    {n:"16", page:"ratings",        label:"Rating by the Head of the Institution",       got:i16, max:MAX.i16}
  ];
  const grand = items.reduce((a, x) => a + x.got, 0);

  /* Mandatory items for sanction of increment. */
  const gates = [
    {l:"Item 1.c — PBL project presented at a competition outside the institution", ok:i1c > 0,    page:"teaching",    need:"any score"},
    {l:"Item 3 — Research publications",                                            ok:i3 >= 50,   page:"research",    need:"minimum 50"},
    {l:"Item 4 — Qualifying in MOOCs through SWAYAM / NPTEL",                       ok:i4 > 0,     page:"development", need:"one per academic year"},
    {l:"Item 6 — Attending FDPs",                                                   ok:i6 > 0,     page:"development", need:"any score"},
    {l:"Item 9 — Students supervision",                                             ok:i9 >= 100,  page:"supervision", need:"minimum 100"}
  ];

  const required = minFor(state.profile.designation);

  return {
    i1a,i1b,i1c,i1d,i1e,i1f,i1, i2, facultyTrack,
    i3,i4,i5,i6,i7,i7auto,i8,i9,i10,i11, i12a,i12b,i12, i13, i14,i15,i16,
    i9raw, i10raw, i11raw, i14raw, i15raw,
    courses, metHours, avgPass, consultTotal, seedAmt,
    nSci, nSwos, nTexts, nMooc, nRes, nFdp, nSpon,
    items, grand, gates, required,
    eligible:required > 0 && grand >= required && gates.every(g => g.ok)
  };
}

/* Item 2 runs on one of two tracks; designation picks the default. */
function mentorMode(state){
  if(state.mentoring.mode) return state.mentoring.mode;
  const d = state.profile.designation;
  return d === "Professor" || d === "Professor & Head" || d === "Dean" ? "faculty" : "student";
}

/* College name ribbon. Lives in gcet-banner.png beside this file. */
const BANNER_SRC = "gcet-banner.png";

function Logo({size = 40}){
  const [i, setI] = useState(0);
  if(i >= LOGO_SOURCES.length) return null;   /* no file found yet — show nothing rather than a broken image */
  return (
    <img className="logo" src={LOGO_SOURCES[i]} alt="GCET" width={size} height={size}
         style={{width:size, height:size}} onError={() => setI(i + 1)} />
  );
}

/* College name ribbon. Renders nothing until gcet-banner.png is present, so a
   missing file never shows a broken image. */
function Banner({className}){
  const [missing, setMissing] = useState(false);
  if(missing) return null;
  return <img className={className} src={BANNER_SRC}
              alt="Geethanjali College of Engineering and Technology"
              onError={() => setMissing(true)} />;
}

/* Field owns the id so every control is properly labelled. */
function Field({label, tag, hint, error, wide, suffix, children}){
  const id = React.useId();
  const control = React.isValidElement(children) ? React.cloneElement(children, {id}) : children;
  return (
    <div className={"f" + (wide ? " wide" : "")}>
      <label htmlFor={id}>{label}{tag ? <span className={"tag" + (tag === "auto" ? " auto" : "")}>{tag}</span> : null}</label>
      {suffix ? <div className="suffix">{control}<span>{suffix}</span></div> : control}
      {error ? <span className="errtx">{error}</span> : hint ? <span className="help">{hint}</span> : null}
    </div>
  );
}

function Text({value, onChange, bad, className, ...rest}){
  return <input className={(bad ? "bad " : "") + (className || "")} value={value || ""} onChange={e => onChange(e.target.value)} {...rest} />;
}

function Select({value, onChange, options, bad, id, placeholder = "—"}){
  return (
    <select id={id} className={bad ? "bad" : ""} value={value || ""} onChange={e => onChange(e.target.value)}>
      <option value="">{placeholder}</option>
      {options.map(o => <option key={o} value={o}>{o}</option>)}
    </select>
  );
}

function Stat({label, value}){
  return <div className="stat"><div className="l">{label}</div><div className="v tnum">{value}</div></div>;
}

/* =========================================================
   Entry group — one card per declared entry
   ========================================================= */
/* A numbered item of the official form, with its running score. */
function ScoreCard({no, title, max, score, sub, tag, children}){
  return (
    <div className="scorecard">
      <div className="sc-head">
        <span className="sc-no tnum">{no}</span>
        <h3>{title}</h3>
        {tag && <span className="filler">{tag}</span>}
        <span className={"sc-mark" + (score >= max ? " full" : score > 0 ? " part" : "")}>
          <b className="tnum">{score}</b><i>/ {max}</i>
        </span>
      </div>
      <div className="sc-body">
        {sub && <p className="sc-sub">{sub}</p>}
        {children}
      </div>
    </div>
  );
}

/* One row of marks that somebody awards. */
function Mark({label, hint, value, max, onChange}){
  return (
    <div className="mrow">
      <span className="ml">{label}{hint && <i>{hint}</i>}</span>
      <span className="mi">
        <input className="tnum" type="number" min="0" max={max} step="1" inputMode="numeric" placeholder="0"
               value={value} onChange={e => onChange(e.target.value)} />
        <em>/ {max}</em>
      </span>
    </div>
  );
}

/* One row of marks the form works out on its own. */
function AutoMark({label, hint, value, max}){
  return (
    <div className="mrow">
      <span className="ml">{label}{hint && <i>{hint}</i>}</span>
      <span className="mi"><b className="tnum">{value}</b><em>/ {max}</em></span>
    </div>
  );
}

function EntryGroup({spec, slots, data, setEntry, docBySlot, goDocuments, flagged}){
  if(!slots.length){
    return (
      <div className="block">
        <h3>{spec.label} <span className="chip">item {spec.item}</span></h3>
        <div className="none">Nothing declared. Set the count above to add entries here.</div>
      </div>
    );
  }
  return (
    <div className="block">
      <h3>
        {spec.label} <span className="chip">item {spec.item}</span>
        <span className="chip brass">{slots.length} {slots.length === 1 ? "entry" : "entries"}</span>
      </h3>
      <p className="sub">One supporting document is required for each entry. Attach them all together in section J.</p>
      <div className="entries">
        {slots.map((slot, i) => {
          const row = data[slot.key] || {};
          const doc = docBySlot[slot.key];
          const bad = flagged && !String(row.title || "").trim();
          return (
            <div className={"entry" + (bad ? " flag" : "")} key={slot.key} id={"e-" + slot.key}>
              <div className="entry-head">
                <span className="n"><i className="tnum">{i + 1}</i>{spec.label.replace(/s$/, "")} {i + 1}</span>
                {slot.group ? <span className="chip">{slot.group}</span> : null}
                <button type="button" className={"chip chip-btn " + (doc ? (doc.stale ? "warn" : "ok") : "bad")} onClick={goDocuments}>
                  {doc ? (doc.stale ? "re-attach " + doc.name : "✓ " + doc.name) : "document missing"}
                </button>
              </div>
              <div className="entry-body">
                <div className="fgrid">
                  {spec.fields.map(f => (
                    <Field key={f.k} label={f.l} wide={f.wide}>
                      {f.t === "select"
                        ? <Select value={row[f.k]} options={f.o} onChange={v => setEntry(slot.key, f.k, v)} />
                        : <Text
                            type={f.t === "url" ? "url" : f.t === "number" ? "number" : f.t}
                            min={f.t === "number" ? 0 : undefined}
                            placeholder={f.ph}
                            bad={f.k === "title" && bad}
                            value={row[f.k]}
                            onChange={v => setEntry(slot.key, f.k, v)} />}
                    </Field>
                  ))}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* =========================================================
   App
   ========================================================= */
function App(){
  const [state, setState] = useState(blankState);
  const [page, setPage] = useState("profile");
  const [saved, setSaved] = useState(false);
  const [attempted, setAttempted] = useState(false);
  const [review, setReview] = useState(false);
  const [printing, setPrinting] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const [dark, setDark] = useState(() =>
    typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const filesRef = useRef({});
  const bootRef = useRef(false);
  const saveTimer = useRef(null);
  const cloudTimer = useRef(null);

  /* ---------- backend ---------- */
  const [cloud, setCloud] = useState("");          // draft status line
  const [offer, setOffer] = useState(null);        // a newer draft found on the server
  const [send, setSend] = useState(null);          // {phase, done, total, label, result, error}
  const [looked, setLooked] = useState("");        // empid we have already looked up
  const backendOn = typeof PBAS !== "undefined" && PBAS.configured;

  /* ---------- draft restore ---------- */
  useEffect(() => {
    try{
      const raw = localStorage.getItem(STORAGE);
      if(raw){
        const d = JSON.parse(raw);
        d.docs = (d.docs || []).map(x => ({...x, stale:true}));
        const b = blankState();
        setState({...b, ...d,
          profile:{...b.profile, ...d.profile}, counts:{...b.counts, ...d.counts},
          teaching:{...b.teaching, ...d.teaching}, mentoring:{...b.mentoring, ...d.mentoring},
          events:{...b.events, ...d.events}, admin:{...b.admin, ...d.admin},
          seed:{...b.seed, ...d.seed}, ratings:{...b.ratings, ...d.ratings},
          awarded:{...b.awarded, ...d.awarded}});
      }
    }catch(e){ /* storage unavailable */ }
    bootRef.current = true;
  }, []);

  /* ---------- draft save ---------- */
  useEffect(() => {
    if(!bootRef.current) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try{
        localStorage.setItem(STORAGE, JSON.stringify({...state, docs:state.docs.map(({id,name,size,slot}) => ({id,name,size,slot}))}));
        localStorage.setItem(STORAGE + ":at", String(Date.now()));
        setSaved(true);
        setTimeout(() => setSaved(false), 1600);
      }catch(e){ /* ignore */ }
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [state]);

  /* ---------- draft to the server ----------
     Keyed by employee ID: the form has no sign-in, so there is no other
     handle on who is typing. Slower cadence than the local save, because
     this one crosses the network. */
  useEffect(() => {
    const empid = String(state.profile.empid || "").trim();
    if(!bootRef.current || !backendOn || !empid) return;
    clearTimeout(cloudTimer.current);
    cloudTimer.current = setTimeout(() => {
      setCloud("saving");
      PBAS.saveDraft(empid, {...state, docs:state.docs.map(({id,name,size,slot}) => ({id,name,size,slot}))})
        .then(() => { setCloud("saved"); setTimeout(() => setCloud(""), 2200); })
        .catch(() => setCloud("failed"));
    }, 5000);
    return () => clearTimeout(cloudTimer.current);
  }, [state, backendOn]);

  /* The first time a complete-looking employee ID is typed, see whether the
     server already holds a draft newer than this tab's. */
  useEffect(() => {
    const empid = String(state.profile.empid || "").trim();
    if(!bootRef.current || !backendOn || empid.length < 3 || empid === looked) return;
    setLooked(empid);
    PBAS.loadDraft(empid).then(d => {
      if(!d || !d.data) return;
      let localAt = 0;
      try{ localAt = Number(localStorage.getItem(STORAGE + ":at") || 0); }catch(e){}
      if(new Date(d.savedAt).getTime() > localAt + 1000) setOffer(d);
    }).catch(() => {});
  }, [state.profile.empid, backendOn, looked]);

  const acceptDraft = () => {
    if(!offer) return;
    const b = blankState(), d = offer.data;
    d.docs = (d.docs || []).map(x => ({...x, stale:true}));
    setState({...b, ...d,
      profile:{...b.profile, ...d.profile}, counts:{...b.counts, ...d.counts},
      teaching:{...b.teaching, ...d.teaching}, mentoring:{...b.mentoring, ...d.mentoring},
      events:{...b.events, ...d.events}, admin:{...b.admin, ...d.admin},
      seed:{...b.seed, ...d.seed}, ratings:{...b.ratings, ...d.ratings},
      awarded:{...b.awarded, ...d.awarded}});
    filesRef.current = {};
    setOffer(null);
    setPage("profile");
    window.scrollTo({top:0});
  };

  /* ---------- printing renders every page ---------- */
  useEffect(() => {
    if(!printing) return;
    const t = setTimeout(() => { window.print(); setPrinting(false); }, 80);
    return () => clearTimeout(t);
  }, [printing]);

  /* ---------- setters ---------- */
  const setProfile = (k, v) => setState(s => ({...s, profile:{...s.profile, [k]:v}}));
  const setLoad    = (k, v) => setState(s => ({...s, load:{...s.load, [k]:v}}));
  const setCount   = (k, v) => setState(s => ({...s, counts:{...s.counts, [k]:v}}));
  const setTeach   = (k, v) => setState(s => ({...s, teaching:{...s.teaching, [k]:v}}));
  const setMentor  = (k, v) => setState(s => ({...s, mentoring:{...s.mentoring, [k]:v}}));
  const setEvent   = (k, v) => setState(s => ({...s, events:{...s.events, [k]:v}}));
  const setAdmin   = (k, v) => setState(s => ({...s, admin:{...s.admin, [k]:v}}));
  const setAwarded = (k, v) => setState(s => ({...s, awarded:{...s.awarded, [k]:v}}));
  const setSeed    = (k, v) => setState(s => ({...s, seed:{...s.seed, [k]:v}}));
  const setRating  = (k, v) => setState(s => ({...s, ratings:{...s.ratings, [k]:v}}));
  const setEntry   = useCallback((slotKey, f, v) =>
    setState(s => ({...s, data:{...s.data, [slotKey]:{...(s.data[slotKey] || {}), [f]:v}}})), []);

  /* ---------- derived slots ---------- */
  const slotsBySpec = useMemo(() => {
    const out = {};
    SPECS.forEach(spec => {
      const list = [];
      spec.groups.forEach(g => {
        const total = cnt(state.counts[g.c]);
        for(let i = 0; i < total; i++) list.push({key:`${spec.id}|${g.k}|${i}`, spec, group:g.k, index:i});
      });
      out[spec.id] = list;
    });
    return out;
  }, [state.counts]);

  const allSlots = useMemo(() => SPECS.reduce((a, s) => a.concat(slotsBySpec[s.id]), []), [slotsBySpec]);

  /* prefill the grouped dropdown the first time a slot appears */
  useEffect(() => {
    setState(s => {
      const patch = {};
      allSlots.forEach(slot => {
        const gf = slot.spec.groupField;
        if(!gf || !slot.group) return;
        const cur = s.data[slot.key];
        if(!cur || cur[gf] === undefined) patch[slot.key] = {...(cur || {}), [gf]:slot.group};
      });
      return Object.keys(patch).length ? {...s, data:{...s.data, ...patch}} : s;
    });
  }, [allSlots]);

  const docBySlot = useMemo(() => {
    const m = {};
    state.docs.forEach(d => { if(d.slot) m[d.slot] = d; });
    return m;
  }, [state.docs]);

  const unassigned = useMemo(() => state.docs.filter(d => !d.slot), [state.docs]);
  const liveDocs = useMemo(() => state.docs.filter(d => d.slot && !d.stale).length, [state.docs]);

  /* ---------- documents ---------- */
  const slotTitle = useCallback(slot => {
    const row = state.data[slot.key] || {};
    return row.title || `${slot.spec.label.replace(/s$/, "")} ${slot.index + 1}`;
  }, [state.data]);

  const addFiles = useCallback(fileList => {
    const accepted = [], rejected = [];
    Array.prototype.forEach.call(fileList, f => {
      if(f.size > MAX_MB * 1024 * 1024){ rejected.push(f.name); return; }
      const id = uid();
      filesRef.current[id] = f;
      accepted.push({id, name:f.name, size:f.size, slot:null, stale:false});
    });
    if(rejected.length) window.alert(`Not attached — over ${MAX_MB} MB:\n\n${rejected.join("\n")}`);
    if(!accepted.length) return;

    setState(s => {
      const taken = new Set(s.docs.filter(d => d.slot).map(d => d.slot));
      const free = allSlots.filter(sl => !taken.has(sl.key));
      const out = accepted.map(doc => {
        const tokens = doc.name.toLowerCase().replace(/\.[a-z0-9]+$/, "").split(/[^a-z0-9]+/).filter(t => t.length > 3);
        let best = null, bestScore = 0;
        free.forEach(sl => {
          if(taken.has(sl.key)) return;
          const hay = ((s.data[sl.key] || {}).title || "").toLowerCase();
          if(!hay) return;
          const score = tokens.filter(t => hay.indexOf(t) >= 0).length;
          if(score > bestScore){ bestScore = score; best = sl; }
        });
        if(best && bestScore > 0){ taken.add(best.key); return {...doc, slot:best.key}; }
        return doc;
      });
      return {...s, docs:s.docs.concat(out)};
    });
  }, [allSlots]);

  const assign = (docId, slotKey) => setState(s => ({
    ...s,
    docs:s.docs.map(d =>
      d.id === docId ? {...d, slot:slotKey || null}
      : (slotKey && d.slot === slotKey) ? {...d, slot:null} : d)
  }));
  const setSlotDoc = (slotKey, docId) => setState(s => ({
    ...s,
    docs:s.docs.map(d =>
      d.id === docId ? {...d, slot:slotKey}
      : d.slot === slotKey ? {...d, slot:null} : d)
  }));
  const dropDoc = docId => setState(s => { delete filesRef.current[docId]; return {...s, docs:s.docs.filter(d => d.id !== docId)}; });

  const autoFill = () => setState(s => {
    const taken = new Set(s.docs.filter(d => d.slot).map(d => d.slot));
    const free = allSlots.filter(sl => !taken.has(sl.key));
    let i = 0;
    return {...s, docs:s.docs.map(d => (d.slot || i >= free.length) ? d : {...d, slot:free[i++].key})};
  });

  /* ---------- awards & roles ---------- */
  const addAward = () => setState(s => ({...s, awards:s.awards.concat({id:uid(),title:"",by:"",level:"",date:""})}));
  const setAward = (id, k, v) => setState(s => ({...s, awards:s.awards.map(a => a.id === id ? {...a, [k]:v} : a)}));
  const delAward = id => setState(s => ({...s, awards:s.awards.filter(a => a.id !== id)}));
  const addRole  = () => setState(s => ({...s, roles:s.roles.concat({id:uid(),role:"",nature:""})}));
  const setRole  = (id, k, v) => setState(s => ({...s, roles:s.roles.map(r => r.id === id ? {...r, [k]:v} : r)}));
  const delRole  = id => setState(s => ({...s, roles:s.roles.filter(r => r.id !== id)}));

  /* ---------- computed ---------- */
  const service = serviceText(state.profile.doj);
  const overall = round2(n(state.profile.expA) + n(state.profile.expB) + n(state.profile.expC));
  const totals = useMemo(() => {
    const c = state.counts;
    const j = cnt(c.j_sci) + cnt(c.j_scopus) + cnt(c.j_wos) + cnt(c.j_ieee);
    const cf = cnt(c.c_ieee) + cnt(c.c_springer);
    return {j, cf, pubs:j + cf, pat:cnt(c.p_utility) + cnt(c.p_design)};
  }, [state.counts]);

  const sc = useMemo(() => computeScores(state, slotsBySpec), [state, slotsBySpec]);
  const track = mentorMode(state);

  /* ---------- validation ---------- */
  const problems = useMemo(() => {
    const out = [];
    const p = state.profile;
    if(!p.name.trim())  out.push({page:"profile", text:"Enter the name of the employee."});
    if(!p.dept)         out.push({page:"profile", text:"Select a department."});
    if(!p.empid.trim()) out.push({page:"profile", text:"Enter the employee ID."});
    if(!p.doj)          out.push({page:"profile", text:"Enter the date of joining."});
    else if(new Date(p.doj + "T00:00:00") > new Date()) out.push({page:"profile", text:"The date of joining cannot be in the future."});
    if(!p.designation) out.push({page:"profile", text:"Select a designation — it sets the mentoring track and the minimum marks required."});

    if(!Object.keys(state.load).some(k => String(state.load[k] || "").trim()))
      out.push({page:"teaching", text:"Enter at least one theory subject or laboratory handled during the cycle."});
    if(!state.teaching.c_title.trim()) out.push({page:"teaching", text:"Item 1.c is mandatory — enter the PBL project presented outside the institution."});

    SPECS.forEach(spec => {
      const list = slotsBySpec[spec.id];
      const blank = list.filter(sl => !String((state.data[sl.key] || {}).title || "").trim()).length;
      if(blank) out.push({page:spec.page, text:`${spec.label}: ${blank} ${blank === 1 ? "entry has" : "entries have"} no title filled in.`});
    });

    const missing = allSlots.filter(sl => { const d = docBySlot[sl.key]; return !d || d.stale; }).length;
    if(missing) out.push({page:"documents", text:`${missing} supporting ${missing === 1 ? "document is" : "documents are"} not attached. Attach one per entry, or lower the declared count.`});

    if(!state.declaration) out.push({page:"declaration", text:"Tick the declaration before submitting."});
    return out;
  }, [state, slotsBySpec, allSlots, docBySlot, sc]);

  const pageStatus = useMemo(() => {
    const st = {};
    PAGES.forEach(pg => {
      const bad = problems.filter(i => i.page === pg.id).length;
      const touched =
        pg.id === "profile" ? Object.values(state.profile).some(Boolean)
        : pg.id === "teaching" ? Object.values(state.load).some(Boolean) || Object.values(state.teaching).some(Boolean)
        : pg.id === "mentoring" ? Object.values(state.mentoring).some(Boolean)
        : pg.id === "research" ? slotsBySpec.journal.length + slotsBySpec.conference.length + slotsBySpec.patent.length + slotsBySpec.book.length + slotsBySpec.chapter.length > 0
        : pg.id === "development" ? slotsBySpec.fdp.length + slotsBySpec.nptel.length + slotsBySpec.resource.length > 0 || !!state.counts.credits
        : pg.id === "projects" ? slotsBySpec.sponsored.length + slotsBySpec.consultancy.length > 0 || Object.values(state.seed).some(Boolean)
        : pg.id === "supervision" ? slotsBySpec.supervision.length > 0 || Object.values(state.events).some(Boolean)
        : pg.id === "administration" ? Object.values(state.admin).some(Boolean) || state.awards.length > 0 || state.roles.some(r => r.role)
        : pg.id === "ratings" ? Object.values(state.ratings).some(Boolean)
        : pg.id === "documents" ? state.docs.length > 0
        : state.declaration;
      st[pg.id] = bad ? (touched ? "part" : "") : (touched ? "ok" : "");
    });
    return st;
  }, [problems, state, slotsBySpec]);

  const submit = () => {
    setAttempted(true);
    if(problems.length){
      setReview(false);
      setPage(problems[0].page);
      window.scrollTo({top:0, behavior:"smooth"});
    }else{
      setReview(true);
      setPage("declaration");
    }
  };

  /* Hand the form to the SDC: certificates first, then the submission
     itself, which files submission.json and adds the spreadsheet row. */
  const sendToSDC = () => {
    if(!backendOn || (send && send.phase === "sending")) return;
    const files = state.docs
      .filter(d => filesRef.current[d.id])
      .map(d => ({name:d.name, slot:d.slot || null, file:filesRef.current[d.id]}));

    setSend({phase:"sending", done:0, total:files.length + 3, label:"Starting"});
    PBAS.submit(buildPayload(), files, (done, total, label) => setSend({phase:"sending", done, total, label}))
      .then(res => {
        setSend({phase:"done", result:res});
        PBAS.deleteDraft(String(state.profile.empid || "").trim()).catch(() => {});
        try{
          localStorage.removeItem(STORAGE);
          localStorage.removeItem(STORAGE + ":at");
        }catch(e){}
        window.scrollTo({top:0, behavior:"smooth"});
      })
      .catch(e => setSend({phase:"error", error:e.message}));
  };

  const clearAll = () => {
    if(!window.confirm("Clear every field, entry and attachment, and start a fresh appraisal form?")) return;
    filesRef.current = {};
    setState(blankState());
    setAttempted(false); setReview(false); setPage("profile");
    setSend(null);
    try{
      localStorage.removeItem(STORAGE);
      localStorage.removeItem(STORAGE + ":at");
    }catch(e){}
    if(backendOn) PBAS.deleteDraft(String(state.profile.empid || "").trim()).catch(() => {});
    setLooked("");
  };

  const buildPayload = useCallback(() => ({
      exportedOn:new Date().toISOString(),
      profile:{...state.profile, experienceInGcet:service, overallExperience:overall},
      teachingLoad:state.load,
      declaredCounts:state.counts,
      entries:allSlots.map(sl => ({
        section:sl.spec.label, group:sl.group, ...(state.data[sl.key] || {}),
        document:(docBySlot[sl.key] || {}).name || null
      })),
      classroomTeaching:{...state.teaching, theoryCourses:sc.courses},
      mentoring:{track:track === "faculty" ? "Faculty mentoring" : "Student mentoring", ...state.mentoring},
      administration:{
        assignments:ADMIN_ROLES.filter(x => state.admin[x.k]).map(x => ({role:x.l, marks:x.m})),
        note:state.adminNote
      },
      organizedActivities:ORG_ACTIVITIES.filter(x => cnt(state.events[x.k])).map(x => ({activity:x.l, count:cnt(state.events[x.k]), marksEach:x.m})),
      internalSeedFunding:state.seed,
      marksAwardedAboveBands:state.awarded,
      ratings:state.ratings,
      scores:{
        items:sc.items.map(x => ({item:x.n, description:x.label, score:x.got, max:x.max})),
        grandTotal:sc.grand, outOf:MAX.total,
        minimumRequired:sc.required || null,
        mandatory:sc.gates.map(g => ({requirement:g.l, need:g.need, met:g.ok})),
        eligibleForIncrement:sc.eligible
      },
      awards:state.awards, roles:state.roles,
      otherDocuments:unassigned.map(d => d.name),
      remarks:state.remarks, declaration:state.declaration
  }), [state, service, overall, allSlots, docBySlot, sc, track, unassigned]);

  const exportJSON = () => {
    const payload = buildPayload();
    const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url;
    a.download = `PBAS-${(state.profile.empid || "faculty").replace(/[^\w.-]+/g, "_")}-2025-26.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const toggleTheme = () => {
    const root = document.documentElement;
    const isDark = root.getAttribute("data-theme")
      ? root.getAttribute("data-theme") === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", isDark ? "light" : "dark");
    setDark(!isDark);
  };

  const show = id => printing || page === id;
  const flagged = attempted;

  /* =============== render =============== */
  return (
    <React.Fragment>
      <div className="printhead">
        <Banner className="print-banner" />
        <Logo size={52} />
        <div className="print-divider"></div>
        <div>
          <h1>GCET · Performance Based Faculty Appraisal System (PBAS)</h1>
          <p>Software Development Cell</p>
        </div>
        <div className="cy">Appraisal cycle<b>2025 – 2026</b>July 2025 to June 2026</div>
      </div>

      <header className="topbar">
        <div className="brand">
          <Banner className="college-banner" />
          <Logo size={40} />
          <div className="brand-divider"></div>
          <div className="brand-txt">
            <h1>GCET &middot; Performance Based Faculty Appraisal System</h1>
            <p>Software Development Cell &middot; PBAS</p>
          </div>
        </div>
        <div className="sp"></div>
        <div className="cyclechip">Appraisal cycle<b>2025 – 2026</b></div>
        <span className={"docpill" + (allSlots.length && liveDocs === allSlots.length ? " done" : "")}>
          Documents <b className="tnum">{liveDocs} / {allSlots.length}</b>
        </span>
        {backendOn && cloud && (
          <span className={"cloudpill noprint" + (cloud === "failed" ? " failed" : "")}>
            {cloud === "saving" ? "Saving\u2026" : cloud === "saved" ? "Draft saved to the SDC" : "Server draft failed"}
          </span>
        )}
        <button type="button" className="btn btn-quiet btn-sm" onClick={toggleTheme}>{dark === null ? "Theme" : dark ? "Light" : "Dark"}</button>
        <button type="button" className="btn btn-sm" onClick={exportJSON}>Export</button>
        <button type="button" className="btn btn-sm" onClick={() => setPrinting(true)}>Print</button>
        <button type="button" className="btn btn-primary btn-sm" onClick={submit}>Review &amp; submit</button>
      </header>

      <nav className="navstrip">
        {PAGES.map(pg => (
          <button key={pg.id} type="button" className={page === pg.id ? "on" : ""} onClick={() => setPage(pg.id)}>{pg.k} · {pg.label}</button>
        ))}
      </nav>

      <div className="shell">
        <aside className="side">
          <h3>Sections</h3>
          <div className="navlist">
            {PAGES.map(pg => (
              <button key={pg.id} type="button" className={"navitem" + (page === pg.id ? " on" : "")} onClick={() => setPage(pg.id)}>
                <span className="k">{pg.k}</span>
                <span>{pg.label}</span>
                <span className={"st " + pageStatus[pg.id]}></span>
              </button>
            ))}
          </div>
          <div className="sideprog">
            <div className="lbl"><span>Documents attached</span><span className="tnum">{liveDocs}/{allSlots.length}</span></div>
            <div className="bar"><i style={{width:(allSlots.length ? liveDocs / allSlots.length * 100 : 0) + "%"}}></i></div>
          </div>
          <div className="savestate"><span className={"dot" + (saved ? " on" : "")}></span>{saved ? "Draft saved" : "Draft saves as you type"}</div>
          <div style={{margin:"18px 10px 0"}}>
            <button type="button" className="btn btn-quiet btn-sm" onClick={clearAll}>Clear form</button>
          </div>
        </aside>

        <main className="main">
          <div className="page">

            {offer && !printing && (
              <div className="notebox noprint">
                <div>
                  <b>A newer draft is saved against employee ID {state.profile.empid}</b>, from{" "}
                  {new Date(offer.savedAt).toLocaleString("en-IN")}. Loading it replaces what is on
                  screen now. Certificates will need re-attaching either way.
                </div>
                <div className="sp"></div>
                <button type="button" className="btn btn-sm" onClick={() => setOffer(null)}>Keep this one</button>
                <button type="button" className="btn btn-primary btn-sm" onClick={acceptDraft}>Load the saved draft</button>
              </div>
            )}

            {attempted && problems.length > 0 && (
              <div className="issues noprint">
                <h4>{problems.length} item{problems.length === 1 ? "" : "s"} need attention</h4>
                <ul>
                  {problems.map((it, i) => (
                    <li key={i}>
                      <span>{it.text}</span>
                      {it.page !== page && <button type="button" onClick={() => { setPage(it.page); window.scrollTo({top:0}); }}>Go</button>}
                    </li>
                  ))}
                </ul>
              </div>
            )}
            {attempted && problems.length === 0 && !review && (
              <div className="okbox noprint">Everything checks out — open Declaration &amp; Submit to finish.</div>
            )}

            {/* ---------------- A. Profile ---------------- */}
            {show("profile") && (
              <section>
                <div className="phead">
                  <p className="eye">Section A · Identity &amp; experience</p>
                  <h2>Faculty Profile</h2>
                  <p>Your identity, date of joining and experience breakup. Service at GCET and overall experience are worked out for you.</p>
                </div>
                <div className="card">
                  <div className="fgrid">
                    <Field label={<span>Name of the employee <em className="req">*</em></span>}>
                      <Text value={state.profile.name} bad={flagged && !state.profile.name.trim()} placeholder="As per service records" onChange={v => setProfile("name", v)} />
                    </Field>
                    <Field label={<span>Employee ID <em className="req">*</em></span>}>
                      <Text value={state.profile.empid} bad={flagged && !state.profile.empid.trim()} placeholder="e.g. GCET/1234" onChange={v => setProfile("empid", v)} />
                    </Field>
                    <Field label={<span>Department <em className="req">*</em></span>}>
                      <Select value={state.profile.dept} options={DEPARTMENTS} bad={flagged && !state.profile.dept} placeholder="Select department" onChange={v => setProfile("dept", v)} />
                    </Field>
                    <Field label={<span>Designation <em className="req">*</em></span>}
                           hint={sc.required ? `Minimum ${sc.required} of ${MAX.total} marks required for sanction of increment.` : "Sets the mentoring track and the minimum marks required."}>
                      <Select value={state.profile.designation} options={DESIGNATIONS} bad={flagged && !state.profile.designation} placeholder="Select designation" onChange={v => setProfile("designation", v)} />
                    </Field>
                    <Field label={<span>Date of joining in GCET <em className="req">*</em></span>} hint="DD / MM / YYYY">
                      <Text type="date" value={state.profile.doj} bad={flagged && !state.profile.doj} onChange={v => setProfile("doj", v)} />
                    </Field>
                    <Field label="Experience in GCET" tag="auto" hint="Calculated as on today.">
                      <input readOnly tabIndex={-1} value={service} placeholder="From the date of joining" />
                    </Field>
                  </div>
                </div>

                <div className="card">
                  <h3 className="ch">Experience breakup</h3>
                  <p className="sub">Enter each in years. The overall figure adds itself up.</p>
                  <div className="fgrid">
                    <Field label="Teaching experience (A)" suffix="years">
                      <Text type="number" min="0" step="0.1" className="tnum" value={state.profile.expA} placeholder="0.0" onChange={v => setProfile("expA", v)} />
                    </Field>
                    <Field label="Industry experience (B)" suffix="years">
                      <Text type="number" min="0" step="0.1" className="tnum" value={state.profile.expB} placeholder="0.0" onChange={v => setProfile("expB", v)} />
                    </Field>
                    <Field label="Research experience (C)" suffix="years" hint="Full-time Ph.D. only.">
                      <Text type="number" min="0" step="0.1" className="tnum" value={state.profile.expC} placeholder="0.0" onChange={v => setProfile("expC", v)} />
                    </Field>
                    <Field label="Overall experience — A + B + C" tag="auto" suffix="years">
                      <input readOnly tabIndex={-1} className="tnum" value={overall} />
                    </Field>
                  </div>
                </div>
              </section>
            )}

            {/* ---------------- B. Classroom teaching · item 1 ---------------- */}
            {show("teaching") && (
              <section>
                <div className="phead">
                  <p className="eye">Section B · Item 1 · 150 marks</p>
                  <h2>Classroom Teaching</h2>
                  <p>Courses handled in each semester, and the six components of item 1. Hours taken and pass percentages entered below settle items 1.a and 1.e on their own.</p>
                </div>

                {[{p:"s1", t:"Semester I"}, {p:"s2", t:"Semester II"}].map(sem => (
                  <div className="card" key={sem.p}>
                    <h3 className="ch">
                      {sem.t}
                      {sem.p === "s2" && (
                        <button type="button" className="btn btn-quiet btn-sm noprint" style={{marginLeft:"auto"}}
                          onClick={() => setState(s => {
                            const nx = {...s.load};
                            ["sub1","sub2","sub3","lab1","lab2","lab3"].forEach(k => {
                              nx["s2_" + k] = s.load["s1_" + k] || "";
                              nx["s2_" + k + "_hrs"] = s.load["s1_" + k + "_hrs"] || "";
                            });
                            [1,2,3].forEach(i => { nx[`s2_sub${i}_pass`] = s.load[`s1_sub${i}_pass`] || ""; });
                            return {...s, load:nx};
                          })}>Same as Semester I</button>
                      )}
                    </h3>
                    <p className="sub">Leave a line blank if it does not apply. A 3-credit theory course needs at least {MIN_HOURS} hours.</p>

                    <div className="loadgroup">
                      <h4>Theory subjects · hours &amp; results</h4>
                      {[1,2,3].map(i => (
                        <div className="courserow" key={"s" + i}>
                          <Field label={`Subject ${i}`}>
                            <Text value={state.load[`${sem.p}_sub${i}`]} placeholder="Course title" onChange={v => setLoad(`${sem.p}_sub${i}`, v)} />
                          </Field>
                          <Field label="Hours taken" suffix="hrs" hint={`Minimum ${MIN_HOURS}`}>
                            <Text type="number" min="0" step="1" className="tnum" value={state.load[`${sem.p}_sub${i}_hrs`]} placeholder="0" onChange={v => setLoad(`${sem.p}_sub${i}_hrs`, v)} />
                          </Field>
                          <Field label="Pass percentage" suffix="%" hint="Theory result">
                            <Text type="number" min="0" max="100" step="0.01" className="tnum" value={state.load[`${sem.p}_sub${i}_pass`]} placeholder="0" onChange={v => setLoad(`${sem.p}_sub${i}_pass`, v)} />
                          </Field>
                        </div>
                      ))}
                    </div>

                    <div className="loadgroup ruled">
                      <h4>Laboratories</h4>
                      {[1,2,3].map(i => (
                        <div className="courserow two" key={"l" + i}>
                          <Field label={`Lab ${i}`}>
                            <Text value={state.load[`${sem.p}_lab${i}`]} placeholder="Laboratory title" onChange={v => setLoad(`${sem.p}_lab${i}`, v)} />
                          </Field>
                          <Field label="Hours taken" suffix="hrs">
                            <Text type="number" min="0" step="1" className="tnum" value={state.load[`${sem.p}_lab${i}_hrs`]} placeholder="0" onChange={v => setLoad(`${sem.p}_lab${i}_hrs`, v)} />
                          </Field>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
