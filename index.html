                    {ADMIN_ROLES.map((x, i) => (
                      <label className="mrow pick" key={x.k}>
                        <span className="ml">{"abcdefghijk"[i]} · {x.l}</span>
                        <span className="cap tnum">{x.m}</span>
                        <input className="chk" type="checkbox" checked={!!state.admin[x.k]} onChange={e => setAdmin(x.k, e.target.checked)} />
                      </label>
                    ))}
                    <AutoMark label="Item 10 total" hint={sc.i10raw > MAX.i10 ? `${sc.i10raw} earned, capped at ${MAX.i10}` : null} value={sc.i10} max={MAX.i10} />
                  </div>
                  <div className="fgrid" style={{marginTop:16}}>
                    <Field label="Any other administrative responsibility — details" wide>
                      <textarea value={state.adminNote} placeholder="Describe the responsibility ticked under (k), if any."
                                onChange={e => setState(s => ({...s, adminNote:e.target.value}))} />
                    </Field>
                  </div>
                </ScoreCard>

                <div style={{height:26}}></div>

                <div className="block">
                  <h3>Nature of the job <span className="chip">item 10</span></h3>
                  <p className="sub">Duties carried out under each assignment ticked above.</p>
                  <div className="entries">
                    {state.roles.map((r, i) => (
                      <div className="entry" key={r.id}>
                        <div className="entry-head">
                          <span className="n"><i className="tnum">{i + 1}</i>Role {i + 1}</span>
                          {state.roles.length > 1 && <button type="button" className="rowx noprint" onClick={() => delRole(r.id)}>Remove</button>}
                        </div>
                        <div className="entry-body">
                          <div className="fgrid">
                            <Field label="Role"><Text value={r.role} placeholder="e.g. NBA Coordinator" onChange={v => setRole(r.id, "role", v)} /></Field>
                            <Field label="Nature of job"><Text value={r.nature} placeholder="Duties and responsibilities" onChange={v => setRole(r.id, "nature", v)} /></Field>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                  <button type="button" className="btn noprint" style={{marginTop:12}} onClick={addRole}>+ Add role</button>
                </div>

                <div className="block">
                  <h3>Awards &amp; recognitions <span className="chip">optional</span></h3>
                  <p className="sub">Not scored on the appraisal form, but recorded with the appraisal. Attach proof in section J if you have it.</p>
                  {!state.awards.length && <div className="none">No awards added yet.</div>}
                  <div className="entries">
                    {state.awards.map((a, i) => (
                      <div className="entry" key={a.id}>
                        <div className="entry-head">
                          <span className="n"><i className="tnum">{i + 1}</i>Award {i + 1}</span>
                          <button type="button" className="rowx noprint" onClick={() => delAward(a.id)}>Remove</button>
                        </div>
                        <div className="entry-body">
                          <div className="fgrid">
                            <Field label="Award / recognition" wide><Text value={a.title} placeholder="Name of the award" onChange={v => setAward(a.id, "title", v)} /></Field>
                            <Field label="Awarded by"><Text value={a.by} placeholder="Awarding body" onChange={v => setAward(a.id, "by", v)} /></Field>
                            <Field label="Level"><Select value={a.level} options={AWARDLEVEL} onChange={v => setAward(a.id, "level", v)} /></Field>
                            <Field label="Date"><Text type="date" value={a.date} onChange={v => setAward(a.id, "date", v)} /></Field>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                  <button type="button" className="btn noprint" style={{marginTop:12}} onClick={addAward}>+ Add award</button>
                </div>
              </section>
            )}

            {/* ---------------- I. Ratings & feedback · items 12, 14 – 16 ---------------- */}
            {show("ratings") && (
              <section>
                <div className="phead">
                  <p className="eye">Section I · Items 12, 14, 15 and 16 · 160 marks</p>
                  <h2>Ratings &amp; Feedback</h2>
                  <p>Students' ratings on TLP, and the ratings awarded by the Group Head, the Head of the Department and the Head of the Institution.</p>
                </div>

                <ScoreCard no="12" title="Students' ratings on TLP" max={MAX.i12} score={sc.i12}
                           sub="Enter the two ratings on the 5-point scale; the marks follow the published bands.">
                  <div className="fgrid">
                    <Field label="Feedback rating" hint="≥4.5: 25 · ≥4 &lt;4.5: 20 · ≥3.5 &lt;4: 15 · ≥3 &lt;3.5: 10 · ≥2.5 &lt;3: 5">
                      <Text type="number" min="0" max="5" step="0.01" className="tnum" value={state.ratings.feedback} placeholder="0.00" onChange={v => setRating("feedback", v)} />
                    </Field>
                    <Field label="Course End Survey rating" hint="≥4.5: 10 · ≥4 &lt;4.5: 8 · ≥3.5 &lt;4: 6 · ≥3 &lt;3.5: 4 · ≥2.5 &lt;3: 2">
                      <Text type="number" min="0" max="5" step="0.01" className="tnum" value={state.ratings.ces} placeholder="0.00" onChange={v => setRating("ces", v)} />
                    </Field>
                  </div>
                  <div className="mrows" style={{marginTop:16}}>
                    <AutoMark label="Feedback"           hint={state.ratings.feedback ? `Rating ${state.ratings.feedback} of 5` : null} value={sc.i12a} max={MAX.i12a} />
                    <AutoMark label="Course End Survey"  hint={state.ratings.ces ? `Rating ${state.ratings.ces} of 5` : null}      value={sc.i12b} max={MAX.i12b} />
                  </div>
                </ScoreCard>

                <ScoreCard no="14" title="Group Head's rating" max={MAX.i14} score={sc.i14} tag="filled by the Group Head">
                  <div className="mrows">
                    <Mark label="Willingness to learn" value={state.ratings.gh_learn} max={15} onChange={v => setRating("gh_learn", v)} />
                    <div className="mrow head"><span className="ml">Participation in group activities</span><span className="cap">35</span></div>
                    {GH_RATING.filter(x => x.k !== "learn").map(x => (
                      <Mark key={x.k} label={"· " + x.l} value={state.ratings["gh_" + x.k]} max={x.m} onChange={v => setRating("gh_" + x.k, v)} />
                    ))}
                  </div>
                  <div className="fgrid" style={{marginTop:16}}>
                    <Field label="Group Head"><Text value={state.ratings.gh_by} placeholder="Name of the Group Head" onChange={v => setRating("gh_by", v)} /></Field>
                  </div>
                </ScoreCard>

                <ScoreCard no="15" title="HoD's rating" max={MAX.i15} score={sc.i15} tag="filled by the HoD"
                           sub="The ten components below add up to 65 on the printed form; the item itself is capped at 50.">
                  <div className="mrows">
                    {HOD_RATING.map((x, i) => (
                      <Mark key={x.k} label={"abcdefghij"[i] + " · " + x.l} value={state.ratings["hod_" + x.k]} max={x.m} onChange={v => setRating("hod_" + x.k, v)} />
                    ))}
                    <AutoMark label="Item 15 total" hint={sc.i15raw > MAX.i15 ? `${sc.i15raw} awarded, capped at ${MAX.i15}` : null} value={sc.i15} max={MAX.i15} />
                  </div>
                  <div className="fgrid" style={{marginTop:16}}>
                    <Field label="Head of the Department"><Text value={state.ratings.hod_by} placeholder="Name of the HoD" onChange={v => setRating("hod_by", v)} /></Field>
                  </div>
                </ScoreCard>

                <ScoreCard no="16" title="Rating by the Head of the Institution" max={MAX.i16} score={sc.i16} tag="filled by the Principal">
                  <div className="mrows">
                    <Mark label="Rating by the Head of the Institution" value={state.ratings.hoi} max={MAX.i16} onChange={v => setRating("hoi", v)} />
                  </div>
                  <div className="fgrid" style={{marginTop:16}}>
                    <Field label="Head of the Institution"><Text value={state.ratings.hoi_by} placeholder="Name of the Principal / Director" onChange={v => setRating("hoi_by", v)} /></Field>
                  </div>
                </ScoreCard>
              </section>
            )}

            {/* ---------------- J. Documents ---------------- */}
            {show("documents") && (
              <section>
                <div className="phead">
                  <p className="eye">Section J · Supporting evidence</p>
                  <h2>Documents</h2>
                  <p>Drop every certificate and proof here in one go. Files matching an entry title are assigned automatically — fix the rest from the list below.</p>
                </div>

                <label className={"dz noprint" + (dragOver ? " over" : "")}
                  onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                  onDragLeave={() => setDragOver(false)}
                  onDrop={e => { e.preventDefault(); setDragOver(false); addFiles(e.dataTransfer.files); }}>
                  <div className="dzicon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5-5 5 5"/><path d="M12 5v13"/>
                    </svg>
                  </div>
                  <p className="big">Drop all your documents here</p>
                  <p className="sm">or click to browse — select as many files as you like at once. PDF, JPG or PNG, up to {MAX_MB} MB each.</p>
                  <input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.webp" onChange={e => { addFiles(e.target.files); e.target.value = ""; }} />
                </label>

                <div className="metertext">
                  <span>{allSlots.length === 0 ? "No documents required yet — declare your counts in sections C and D."
                        : liveDocs === allSlots.length ? "Every entry has its document."
                        : `${allSlots.length - liveDocs} document${allSlots.length - liveDocs === 1 ? "" : "s"} still to attach.`}</span>
                  <b className="tnum">{liveDocs} / {allSlots.length}</b>
                </div>
                <div className="bar tall"><i style={{width:(allSlots.length ? liveDocs / allSlots.length * 100 : 0) + "%"}}></i></div>

                {allSlots.length > 0 && (
                  <div className="block" style={{marginTop:26}}>
                    <h3>Required documents
                      {unassigned.length > 0 && <button type="button" className="btn btn-quiet btn-sm noprint" style={{marginLeft:"auto"}} onClick={autoFill}>Assign remaining in order</button>}
                    </h3>
                    <p className="sub">One per declared entry.</p>
                    <div className="slotlist">
                      {allSlots.map(sl => {
                        const doc = docBySlot[sl.key];
                        const cls = doc ? (doc.stale ? "slot stale" : "slot filled") : "slot";
                        return (
                          <div className={cls} key={sl.key}>
                            <div className="who">
                              <div className="t">{slotTitle(sl)}</div>
                              <div className="m">{sl.spec.label}{sl.group ? " · " + sl.group : ""} · entry {sl.index + 1}
                                {doc && doc.stale ? " · re-attach after reload" : ""}</div>
                            </div>
                            <select value={doc ? doc.id : ""} onChange={e => e.target.value ? setSlotDoc(sl.key, e.target.value) : (doc && assign(doc.id, null))}>
                              <option value="">{doc ? "— remove —" : "Choose a file…"}</option>
                              {doc && <option value={doc.id}>{doc.name}</option>}
                              {unassigned.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                            </select>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                <div className="block">
                  <h3>Unassigned &amp; other documents <span className="chip">{unassigned.length}</span></h3>
                  <p className="sub">Anything not tied to an entry is submitted as a general supporting document.</p>
                  {!unassigned.length && <div className="none">Nothing here. Files you drop above appear until they are assigned.</div>}
                  <div className="pool">
                    {unassigned.map(d => (
                      <div className="poolrow" key={d.id}>
                        <span className="nm">{d.name}</span>
                        <span className="sz tnum">{d.stale ? "re-attach" : fmtSize(d.size)}</span>
                        <button type="button" className="x noprint" title="Remove" aria-label={"Remove " + d.name} onClick={() => dropDoc(d.id)}>×</button>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            )}

            {/* ---------------- K. Score summary & declaration ---------------- */}
            {show("declaration") && (
              <section>
                <div className="phead">
                  <p className="eye">Section K · Grand total · 1000 marks</p>
                  <h2>Score Summary &amp; Submit</h2>
                  <p>The sixteen items of the appraisal form, the grand total, and the minimum required for sanction of increment.</p>
                </div>

                <div className="gt">
                  <div className="gt-top">
                    <div>
                      <p className="eye" style={{margin:"0 0 6px"}}>Grand total</p>
                      <div className="gt-score tnum">{sc.grand}<span> / {MAX.total}</span></div>
                    </div>
                    <div className="gt-note">
                      {sc.required
                        ? <React.Fragment><b>{state.profile.designation}</b>Minimum required: {sc.required}</React.Fragment>
                        : <React.Fragment><b>Select a designation</b>to see the minimum required</React.Fragment>}
                    </div>
                  </div>
                  <div className="gt-bar">
                    <i style={{width:Math.min(100, sc.grand / MAX.total * 100) + "%"}}></i>
                    {sc.required > 0 && <span className="mk" style={{left:(sc.required / MAX.total * 100) + "%"}}></span>}
                  </div>
                  <div className="gt-legend">
                    <span>0</span>
                    {sc.required > 0 && <span>minimum {sc.required}</span>}
                    <span>{MAX.total}</span>
                  </div>

                  {sc.required > 0 && (
                    <div className={"verdict " + (sc.eligible ? "ok" : "no")}>
                      {sc.eligible
                        ? `Eligible — ${sc.grand} of ${MAX.total}, above the ${sc.required} required for a ${state.profile.designation}, with every mandatory item met.`
                        : sc.grand < sc.required
                          ? `${sc.required - sc.grand} more mark${sc.required - sc.grand === 1 ? "" : "s"} needed to reach the ${sc.required} required for a ${state.profile.designation}.`
                          : `The total clears ${sc.required}, but ${sc.gates.filter(g => !g.ok).length} mandatory item${sc.gates.filter(g => !g.ok).length === 1 ? " is" : "s are"} not yet met.`}
                    </div>
                  )}
                </div>

                <div className="card">
                  <h3 className="ch">Item-wise score</h3>
                  <p className="sub">Every item of the printed appraisal form, in order.</p>
                  <div className="ledger">
                    <div className="lrow hdr"><span className="li"><span>#</span></span><span className="lt"><span>Item</span></span><span className="lm"><span>Score</span></span><span className="lx"><span>Max</span></span></div>
                    {sc.items.map(it => (
                      <div className="lrow" key={it.n}>
                        <span className="li tnum">{it.n}</span>
                        <span className="lt">{it.label}</span>
                        <span className="lm tnum">{it.got}</span>
                        <span className="lx tnum">{it.max}</span>
                      </div>
                    ))}
                    <div className="lrow total"><span className="li"></span><span className="lt">Grand Total</span><span className="lm tnum">{sc.grand}</span><span className="lx tnum">{MAX.total}</span></div>
                  </div>
                </div>

                <div className="card">
                  <h3 className="ch">Mandatory for sanction of increment</h3>
                  <p className="sub">Point numbers 1.c, 3 (minimum score of 50), 4, 6 and 9 (minimum score of 100), subject to the minimum overall score.</p>
                  <div className="gate">
                    {sc.gates.map((g, i) => (
                      <div key={i} className={g.ok ? "yes" : "no"}>
                        <span className="mk">{g.ok ? "✓" : "✕"}</span>
                        <span>{g.l} <em style={{fontStyle:"normal",color:"var(--ink-3)"}}>— {g.need}</em></span>
                        {!g.ok && g.page !== page && (
                          <button type="button" className="btn btn-quiet btn-sm noprint" style={{marginLeft:"auto"}}
                                  onClick={() => { setPage(g.page); window.scrollTo({top:0}); }}>Go</button>
                        )}
                      </div>
                    ))}
                  </div>
                  <div className="ledger" style={{marginTop:20}}>
                    <div className="lrow hdr"><span className="lt"><span>Minimum marks required for</span></span><span className="lm"><span>Marks</span></span></div>
                    {MIN_REQUIRED.map(x => (
                      <div className={"lrow" + (x.m === sc.required ? " total" : "")} key={x.d}>
                        <span className="lt">{x.d}</span><span className="lm tnum">{x.m}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="card">
                  <div className="fgrid">
                    <Field label="Any other information (optional)" wide>
                      <textarea value={state.remarks} placeholder="Memberships of professional bodies, student outcomes, and anything the sixteen items above did not cover."
                                onChange={e => setState(s => ({...s, remarks:e.target.value}))} />
                    </Field>
                  </div>
                  <label className="declare" style={{marginTop:20}}>
                    <input type="checkbox" checked={state.declaration} onChange={e => setState(s => ({...s, declaration:e.target.checked}))} />
                    <span>I declare that the information furnished above is true to the best of my knowledge, and that the uploaded documents are genuine copies of the originals. <em className="req">*</em></span>
                  </label>
                  <div className="signs">
                    <div className="sign">Signature of the Faculty</div>
                    <div className="sign">Signature of the HoD</div>
                    <div className="sign">Signature of the Principal</div>
                    <div className="sign">Signature of the Director</div>
                  </div>
                </div>

                {review && (
                  <div className="card" style={{marginTop:16}}>
                    <h3 className="ch" style={{marginBottom:16}}>Submission summary</h3>
                    <Review state={state} service={service} overall={overall} slots={allSlots} docBySlot={docBySlot} unassigned={unassigned} sc={sc} />
                  </div>
                )}

                {review && !printing && (
                  <div className="card sendpanel noprint">
                    <h3 className="ch">Send to the SDC</h3>

                    {!backendOn && (
                      <p className="sub" style={{margin:0}}>
                        The backend is not configured on this copy of the form \u2014 the Apps
                        Script URL is still a placeholder. Use <b>Print</b> or <b>Export</b> to
                        hand the appraisal in, and see backend/GOOGLE-SETUP.md.
                      </p>
                    )}

                    {backendOn && (!send || send.phase === "error") && (
                      <React.Fragment>
                        <p className="sub" style={{margin:0}}>
                          Filed under <b>{state.profile.empid || "\u2014"}</b>, {state.profile.name || "unnamed"}.
                          This uploads{" "}
                          {state.docs.filter(d => filesRef.current[d.id]).length} certificate
                          {state.docs.filter(d => filesRef.current[d.id]).length === 1 ? "" : "s"} and
                          the completed form, and records a grand total of{" "}
                          <b className="tnum">{round2(sc.grand)}</b> out of {MAX.total}.
                        </p>
                        {send && send.phase === "error" && (
                          <div className="issues" style={{marginTop:16,marginBottom:0}}>
                            <h4>Submission failed</h4>
                            <ul><li><span>{send.error}</span></li></ul>
                          </div>
                        )}
                        <div className="sendrow">
                          <button type="button" className="btn btn-primary btn-lg" onClick={sendToSDC}>
                            {send && send.phase === "error" ? "Try again" : "Submit to the SDC"}
                          </button>
                          <div className="sp"></div>
                          <button type="button" className="btn btn-sm" onClick={exportJSON}>Keep a copy</button>
                        </div>
                      </React.Fragment>
                    )}

                    {backendOn && send && send.phase === "sending" && (
                      <React.Fragment>
                        <p className="sub" style={{margin:0}}>Uploading. Leave this tab open until it finishes.</p>
                        <div className="bar tall" style={{marginTop:14}}>
                          <i style={{width:(send.total ? send.done / send.total * 100 : 0) + "%"}}></i>
                        </div>
                        <p className="steps">{send.done} of {send.total} &middot; {send.label}</p>
                      </React.Fragment>
                    )}

                    {backendOn && send && send.phase === "done" && (
                      <React.Fragment>
                        <div className="okbox" style={{marginBottom:0}}>
                          Submitted. {send.result.uploaded} certificate
                          {send.result.uploaded === 1 ? "" : "s"} and the completed form are with the SDC.
                        </div>
                        <p className="receipt">
                          Reference <code>{send.result.reference}</code>. Keep it \u2014 it is what
                          identifies this submission to the SDC.
                          {send.result.folderUrl && <React.Fragment>{" "}
                            <a href={send.result.folderUrl} target="_blank" rel="noopener noreferrer">Open the evidence folder</a>.
                          </React.Fragment>}
                        </p>
                        {send.result.failed.length > 0 && (
                          <p className="fail">
                            {send.result.failed.length} certificate
                            {send.result.failed.length === 1 ? "" : "s"} did not upload
                            ({send.result.failed.map(f => f.name).join(", ")}). The submission was
                            recorded without {send.result.failed.length === 1 ? "it" : "them"} &mdash;
                            tell the SDC, or submit again once the file is in order.
                          </p>
                        )}
                        <div className="sendrow">
                          <button type="button" className="btn" onClick={exportJSON}>Download a copy</button>
                          <button type="button" className="btn" onClick={() => setPrinting(true)}>Print</button>
                        </div>
                      </React.Fragment>
                    )}
                  </div>
                )}
              </section>
            )}

            {!printing && (
              <div className="pager noprint">
                <button type="button" className="btn" disabled={PAGES.findIndex(p => p.id === page) === 0}
                  onClick={() => { const i = PAGES.findIndex(p => p.id === page); setPage(PAGES[i - 1].id); window.scrollTo({top:0}); }}>← Back</button>
                <div className="sp"></div>
                {page === "declaration"
                  ? <button type="button" className="btn btn-primary btn-lg" onClick={submit}>Review &amp; submit</button>
                  : <button type="button" className="btn btn-primary"
                      onClick={() => { const i = PAGES.findIndex(p => p.id === page); setPage(PAGES[i + 1].id); window.scrollTo({top:0}); }}>
                      Next: {PAGES[PAGES.findIndex(p => p.id === page) + 1].label} →
                    </button>}
              </div>
            )}
          </div>
        </main>
      </div>

      <footer className="app-footer noprint">
        <div className="app-footer-inner">
          <div className="footer-left">
            <span>&copy; {new Date().getFullYear()} Geethanjali College of Engineering and Technology</span>
            <span className="footer-sep">&bull;</span>
            <span>Performance Based Faculty Appraisal System (PBAS)</span>
          </div>
          <div className="footer-credit">@designed &amp; developed by team SDC</div>
        </div>
      </footer>
      <div className="print-footer">
        <p>&copy; Geethanjali College of Engineering and Technology &middot; PBAS &middot; @designed &amp; developed by team SDC</p>
      </div>
    </React.Fragment>
  );
}

/* =========================================================
   Review summary
   ========================================================= */
function Row({k, v}){
  const blank = v === "" || v === null || v === undefined;
  return <div className="rrow"><span className="k">{k}</span><span className={"v" + (blank ? " none" : "")}>{blank ? "not provided" : v}</span></div>;
}
function Review({state, service, overall, slots, docBySlot, unassigned, sc}){
  const p = state.profile;
  const bySpec = {};
  slots.forEach(sl => { (bySpec[sl.spec.id] = bySpec[sl.spec.id] || []).push(sl); });
  return (
    <div className="rgrid">
      <div className="rsec">
        <h5>A · Faculty profile</h5>
        <Row k="Name" v={p.name} /><Row k="Employee ID" v={p.empid} /><Row k="Department" v={p.dept} />
        <Row k="Designation" v={p.designation} /><Row k="Date of joining" v={fmtDate(p.doj)} />
        <Row k="Experience in GCET" v={service} /><Row k="Overall experience" v={overall + " years"} />
      </div>
      <div className="rsec">
        <h5>Item-wise score</h5>
        {sc.items.map(it => <Row key={it.n} k={`${it.n}. ${it.label}`} v={`${it.got} / ${it.max}`} />)}
        <Row k="Grand Total" v={`${sc.grand} / ${MAX.total}`} />
        <Row k="Minimum required" v={sc.required ? String(sc.required) : ""} />
        <Row k="Eligible for increment" v={sc.required ? (sc.eligible ? "Yes" : "No") : ""} />
      </div>
      <div className="rsec">
        <h5>B · Classroom teaching (item 1)</h5>
        {sc.courses.length
          ? sc.courses.map((c, i) => <Row key={i} k={`${c.sem} · ${c.title}`} v={`${c.hours || 0} hrs · ${c.pass || 0}%`} />)
          : <Row k="Theory courses" v="" />}
        {["s1","s2"].map(s => [1,2,3].map(i => state.load[`${s}_lab${i}`]
          ? <Row key={s + i} k={`${s === "s1" ? "Sem I" : "Sem II"} · Lab ${i}`} v={`${state.load[`${s}_lab${i}`]} · ${state.load[`${s}_lab${i}_hrs`] || 0} hrs`} />
          : null))}
        <Row k="1.c PBL project" v={state.teaching.c_title} />
        <Row k="1.c Presented at" v={[state.teaching.c_event, state.teaching.c_venue].filter(Boolean).join(" · ")} />
        <Row k="1.c Project work" v={state.teaching.c_hours ? `${state.teaching.c_hours} hrs · ${state.teaching.c_cases || 0} case studies` : ""} />
      </div>
      <div className="rsec">
        <h5>C · Mentoring (item 2)</h5>
        <Row k="Track" v={mentorMode(state) === "faculty" ? "Faculty mentoring" : "Student mentoring"} />
        <Row k={mentorMode(state) === "faculty" ? "Faculty mentored" : "Students mentored"} v={state.mentoring.mentees} />
        <Row k="Marks" v={`${sc.i2} / ${MAX.i2}`} />
      </div>
      {SPECS.map(spec => (
        <div className="rsec" key={spec.id}>
          <h5>{spec.label}</h5>
          {(bySpec[spec.id] || []).length === 0
            ? <Row k="Entries" v="" />
            : bySpec[spec.id].map((sl, i) => {
                const r = state.data[sl.key] || {};
                const doc = docBySlot[sl.key];
                return <Row key={sl.key} k={`${i + 1}. ${r.title || "Untitled"}`} v={doc ? doc.name : ""} />;
              })}
        </div>
      ))}
      <div className="rsec">
        <h5>F · Projects &amp; consultancy (items 7, 8, 13)</h5>
        <Row k="Sponsored projects secured" v={sc.nSpon ? `${sc.nSpon} · ${sc.i7} marks` : ""} />
        <Row k="Consultancy received" v={sc.consultTotal ? `Rs. ${sc.consultTotal.toLocaleString("en-IN")} · ${sc.i8} marks` : ""} />
        <Row k="Internal seed funding" v={state.seed.title ? `${state.seed.title} · Rs. ${n(state.seed.amount).toLocaleString("en-IN")}` : ""} />
      </div>
      <div className="rsec">
        <h5>G · Supervision &amp; events (items 9, 11)</h5>
        <Row k="Item 9 — supervision" v={`${sc.i9} / ${MAX.i9}`} />
        {ORG_ACTIVITIES.filter(x => cnt(state.events[x.k])).map(x => <Row key={x.k} k={x.l} v={`${cnt(state.events[x.k])} × ${x.m}`} />)}
        <Row k="Item 11 — organization" v={`${sc.i11} / ${MAX.i11}`} />
      </div>
      <div className="rsec">
        <h5>I · Ratings (items 12, 14 – 16)</h5>
        <Row k="Students' feedback" v={state.ratings.feedback ? `${state.ratings.feedback} / 5 · ${sc.i12a} marks` : ""} />
        <Row k="Course End Survey" v={state.ratings.ces ? `${state.ratings.ces} / 5 · ${sc.i12b} marks` : ""} />
        <Row k="Group Head's rating" v={`${sc.i14} / ${MAX.i14}`} />
        <Row k="HoD's rating" v={`${sc.i15} / ${MAX.i15}`} />
        <Row k="Head of the Institution" v={`${sc.i16} / ${MAX.i16}`} />
      </div>
      <div className="rsec">
        <h5>H · Administration, awards &amp; roles (item 10)</h5>
        {ADMIN_ROLES.filter(x => state.admin[x.k]).length
          ? ADMIN_ROLES.filter(x => state.admin[x.k]).map(x => <Row key={x.k} k={x.l} v={String(x.m)} />)
          : <Row k="Administration assignments" v="" />}
        <Row k="Item 10 total" v={`${sc.i10} / ${MAX.i10}`} />
        {state.awards.length ? state.awards.map((a, i) => <Row key={a.id} k={`Award ${i + 1}. ${a.title || "Untitled"}`} v={[a.by, a.level, fmtDate(a.date)].filter(Boolean).join(" · ")} />) : <Row k="Awards" v="" />}
        {state.roles.filter(r => r.role).length ? state.roles.filter(r => r.role).map((r, i) => <Row key={r.id} k={`Role ${i + 1}. ${r.role}`} v={r.nature} />) : <Row k="Roles" v="" />}
      </div>
      <div className="rsec">
        <h5>J · Documents</h5>
        <Row k="Attached to entries" v={`${slots.filter(s => docBySlot[s.key] && !docBySlot[s.key].stale).length} / ${slots.length}`} />
        <Row k="Other documents" v={unassigned.length ? String(unassigned.length) : ""} />
        <Row k="Credits earned" v={state.counts.credits} />
        <Row k="Remarks" v={state.remarks} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
